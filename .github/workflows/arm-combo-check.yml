# Temporary check, run only on this fork's arm-combo-check* branches (not part of a pull request): bitstreams of SIMD
# against SCALAR on Arm for master, the Hadamard overflow fix (#731), the generic DF_HAD_fast fix, and both.
name: Arm Hadamard fixes, bitstreams

on:
  push:
    branches: [arm-combo-check*]

jobs:
  bitstreams:
    name: "SIMD against SCALAR (GCC 14, ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build
        shell: bash
        run: |
          # overflow: the two #731 commits; generic: the DF_HAD_fast fix; both: this branch (the merge of the two)
          git worktree add ../master b401ac9
          git worktree add ../overflow 7aaf2c2
          git worktree add ../generic 40c6ccc
          for v in master overflow generic both; do
            src=../$v; [ $v = both ] && src=.
            cmake -S $src -B ../build-$v -G Ninja -DCMAKE_BUILD_TYPE=Release -DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF \
                  -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 > /dev/null
            cmake --build ../build-$v --target vvencFFapp > /dev/null
          done
      - name: Make a test clip
        shell: bash
        run: |
          python3 - <<'EOF'
          # 416x240 8-bit 4:2:0, 9 frames: moving gradients, blocks and noise, so the encoder tests many block sizes
          import random
          random.seed( 7 )
          w, h = 416, 240
          with open( "clip.yuv", "wb" ) as f:
            for t in range( 9 ):
              y = bytearray( w * h )
              for r in range( h ):
                for c in range( w ):
                  v = ( 2 * c + 3 * r + 4 * t ) % 256
                  if ( ( c + 3 * t ) // 48 + r // 40 ) % 3 == 0:
                    v = ( v * 3 + 50 ) % 256
                  y[r * w + c] = max( 0, min( 255, v + random.randint( -6, 6 ) ) )
              uv = bytearray( ( ( c * 7 + r * 5 + 9 * t ) % 256 ) for r in range( h // 2 ) for c in range( w // 2 ) )
              f.write( y ); f.write( uv ); f.write( uv )
          EOF
      - name: Bitstreams
        shell: bash
        run: |
          for preset in faster fast medium slow; do
            for v in master overflow generic both; do
              line="$preset $v:"
              for simd in SCALAR NEON SVE2; do
                ../build-$v/bin/vvencFFapp -c cfg/randomaccess_$preset.cfg -i clip.yuv --SourceWidth=416 \
                  --SourceHeight=240 --FrameRate=30 --InputBitDepth=8 -f 9 --Threads=1 --SIMD=$simd -b out.266 > /dev/null
                line="$line $simd $(md5sum < out.266 | cut -c1-12)"
              done
              echo "$line"
            done
          done
