# Temporary check, run only on this fork's sve-check* branches (not part of any pull request): Neoverse N2 / GCC 14.
# N8b (#909 fix): MCTF integer motion error through each LIBRARY's own pointer (MCTF(true).m_motionErrorLumaInt8, the
# NEON kernel: SVE built off), for master (a455d51e = HEAD~2), #909's head (HEAD~1) and N8b (#909 + .github/sve-check/
# MCTF_neon_n8b.cpp). Pictures: luma of frames 0 and 4 of three Xiph 1080p50 clips streamed from media.xiph.org
# (curl | y4m_luma.py | bench, nothing on disk). Per clip: master, #909, N8b, N8b, #909, master; checksums must match.
name: SVE check

on:
  push:
    branches: [sve-check*]

jobs:
  sve:
    name: "N8b MCTF integer error, library pointers on N2 (GCC 14, ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build
        shell: bash
        run: |
          git worktree add -q /tmp/base HEAD~2
          git worktree add -q /tmp/n8 HEAD~1
          git worktree add -q /tmp/n8b HEAD~1
          cp .github/sve-check/MCTF_neon_n8b.cpp /tmp/n8b/source/Lib/CommonLib/arm/neon/MCTF_neon.cpp
          for t in base n8 n8b; do
            echo "$t $(git -C /tmp/$t log --oneline -1 | cut -c1-60) $(git -C /tmp/$t diff --stat | tail -1)"
            b=/tmp/$t/build
            cmake -S /tmp/$t -B $b -G Ninja -DCMAKE_BUILD_TYPE=Release -DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DVVENC_ENABLE_ARM_SIMD_SVE=OFF -DVVENC_ENABLE_ARM_SIMD_SVE2=OFF > /dev/null || echo "configure failed: $t"
            cmake --build $b --target vvenc > /dev/null || echo "build failed: $t"
            defs=$(python3 -c "import json,shlex; e=[x for x in json.load(open('$b/compile_commands.json')) if x['file'].endswith('CommonLib/MCTF.cpp')][0]; print(' '.join(t for t in shlex.split(e['command']) if t.startswith('-D')))")
            g++-14 -O3 -std=gnu++14 $defs -I/tmp/$t/source/Lib -I/tmp/$t/source/Lib/CommonLib -I/tmp/$t/include -I$b -I$b/include \
                .github/sve-check/bench_mctf_lib.cpp $b/lib/libvvenc.a -lpthread -o /tmp/bench_$t || echo "link failed: $t"
          done
          echo "defs: $defs"
      - name: Bench (per clip, base n8 n8b n8b n8 base)
        shell: bash
        run: |
          for clip in crowd_run old_town_cross park_joy; do
            for t in base n8 n8b n8b n8 base; do
              echo "== $clip $t"
              curl -sL https://media.xiph.org/video/derf/y4m/${clip}_1080p50.y4m | python3 .github/sve-check/y4m_luma.py | /tmp/bench_$t || true
            done
          done
