# Temporary check, run only on this fork's sve-check* branches (not part of any pull request): why the SVE
# sumSquaredError is slower than NEON from 32x32 up on Neoverse N2. A variant bench (2 vs 4 dot-product chains) and
# GCC 14's code for the committed kernel. Every step reports and none fails the job: the log is read by hand.
name: SVE check

on:
  push:
    branches: [sve-check*]

jobs:
  sve:
    name: "sumSquaredError SVE variants and GCC 14 code (ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Variant bench (three rounds)
        shell: bash
        run: |
          g++-14 -O3 -std=c++14 -march=armv8.2-a+sve .github/sve-check/var_ssebuf.cpp -o var_ssebuf || true
          ./var_ssebuf || true
      - name: GCC 14 code of the committed kernel (Buffer_sve.cpp, project flags)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 > /dev/null || true
          python3 - <<'EOF' > cmd.sh || true
          import json
          for e in json.load(open("build/compile_commands.json")):
              if e["file"].endswith("arm/sve/Buffer_sve.cpp"):
                  c = e["command"].replace(" -flto=auto", "").replace(" -flto", "").replace(" -fno-fat-lto-objects", "")
                  print("cd " + e["directory"] + " && " + c.split(" -o ")[0] + " -fno-lto -o /tmp/buf_sve.o -c " + e["file"])
          EOF
          cat cmd.sh; bash cmd.sh || true
          objdump -d --no-show-raw-insn /tmp/buf_sve.o | awk '/sumSquaredError_sve/{p=1} p' | head -250 || true
