# Temporary check, run only on this fork's sve-check* branches (not part of any pull request): Neoverse N2 / GCC 14.
# N35 (HEAD~1, second even/odd level of the NEON forward DCT-II 32) against its base #911 (HEAD~2): fastFwdDCT2[2..4]
# through each library's g_tCoeffOps pointer (SVE replaces only fastFwdCore_2D, so N2 runs this NEON kernel).
# bench_n35_lib prints a hash of every output over 6936 cases (must be equal for both libraries) and the best of 5
# times per call; runs base n35 n35 base. The tree's vvenc_unit_test -t TCoeffOps must pass.
name: SVE check

on:
  push:
    branches: [sve-check*]

jobs:
  sve:
    name: "N35 forward DCT-II 32 second even/odd level vs #911 on N2 (GCC 14, ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build
        shell: bash
        run: |
          git worktree add -q /tmp/base HEAD~2
          git worktree add -q /tmp/n35 HEAD~1
          for t in base n35; do
            echo "$t $(git -C /tmp/$t log --oneline -1 | cut -c1-70)"
            b=/tmp/$t/build
            cmake -S /tmp/$t -B $b -G Ninja -DCMAKE_BUILD_TYPE=Release -DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 > /dev/null || echo "configure failed: $t"
            cmake --build $b --target vvenc vvenc_unit_test > /dev/null || echo "build failed: $t"
            defs=$(python3 -c "import json,shlex; e=[x for x in json.load(open('$b/compile_commands.json')) if x['file'].endswith('CommonLib/TrQuant_EMT.cpp')][0]; print(' '.join(t for t in shlex.split(e['command']) if t.startswith('-D')))")
            g++-14 -O3 -std=gnu++14 $defs -I/tmp/$t/source/Lib -I/tmp/$t/source/Lib/CommonLib -I/tmp/$t/include -I$b -I$b/include \
                .github/sve-check/bench_n35_lib.cpp $b/lib/libvvenc.a -lpthread -o /tmp/bench_$t || echo "link failed: $t"
          done
      - name: Unit test (n35, TCoeffOps)
        shell: bash
        run: |
          u=$(find /tmp/n35/build -name vvenc_unit_test -type f | head -1); echo "unit test: $u"
          $u -t TCoeffOps > /tmp/unit.txt 2>&1; rc=$?; tail -2 /tmp/unit.txt; echo "unit rc $rc"; exit $rc
      - name: Bench (base n35 n35 base)
        shell: bash
        run: |
          for t in base n35 n35 base; do echo "== $t"; /tmp/bench_$t || echo "bench failed: $t"; done
