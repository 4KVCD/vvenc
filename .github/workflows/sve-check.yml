# Temporary check, run only on this fork's sve-check* branches (not part of any pull request): Neoverse N2 / GCC 14.
# N13b: N13 (HEAD~2, NEON equal-bins ALF statistics) plus the SVE fallback copied from .github/sve-check/n13b (the
# blocks the equal-bins kernel hands to the 16-bin kernel take the SVE one when SVE runs). Built with SVE off and on.
# Unit tests (SVE build at --SIMD=SVE, and --fast at NEON in both builds); bench_n13 per mask class (statistics must match), two
# rounds; md5 of one encode (crowd_run 1080p50, 5 pictures streamed from media.xiph.org, nothing on disk, preset fast
# with non-linear ALF on) from the SVE build at --SIMD=SVE and --SIMD=NEON (must match). Every step reports.
name: SVE check

on:
  push:
    branches: [sve-check*]

jobs:
  sve:
    name: "N13b ALF equal bins with SVE on N2 (GCC 14, ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build
        shell: bash
        run: |
          echo "cpu sve: $(grep -m1 -ow sve /proc/cpuinfo || echo none)"
          git worktree add -q /tmp/n13 HEAD~2
          git -C /tmp/n13 log --oneline -1
          cp .github/sve-check/n13b/EncAdaptiveLoopFilter_neon.h /tmp/n13/source/Lib/EncoderLib/arm/
          cp .github/sve-check/n13b/EncAdaptiveLoopFilter_neon.cpp /tmp/n13/source/Lib/EncoderLib/arm/neon/
          cp .github/sve-check/n13b/EncAdaptiveLoopFilter_sve.cpp /tmp/n13/source/Lib/EncoderLib/arm/sve/
          git -C /tmp/n13 status --short
          inc() { echo "-I$1/source/Lib -I$1/source/Lib/CommonLib -I$1/source/Lib/CommonLib/arm -I$1/source/Lib/CommonLib/arm/neon -I$1/include"; }
          for v in nosve sve; do
            opt=""; [ $v = nosve ] && opt="-DVVENC_ENABLE_ARM_SIMD_SVE=OFF -DVVENC_ENABLE_ARM_SIMD_SVE2=OFF"
            b=/tmp/n13/build_$v
            cmake -S /tmp/n13 -B $b -G Ninja -DCMAKE_BUILD_TYPE=Release -DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF \
                  -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON $opt > /dev/null || echo "configure failed: $v"
            targets="vvenc vvenc_unit_test"; [ $v = sve ] && targets="$targets vvencFFapp"
            cmake --build $b --target $targets > /dev/null || echo "build failed: $v"
            defs=$(python3 -c "import json,shlex; e=[x for x in json.load(open('$b/compile_commands.json')) if x['file'].endswith('EncoderLib/EncAdaptiveLoopFilter.cpp')][0]; print(' '.join(t for t in shlex.split(e['command']) if t.startswith('-D')))")
            echo "$v defs: $defs"
            g++-14 -O3 -std=gnu++14 $defs $(inc /tmp/n13) -I$b -I$b/include .github/sve-check/n13b/bench_n13.cpp \
                $b/lib/libvvenc.a -lpthread -o /tmp/bench_n13_$v || echo "n13 link failed: $v"
          done
      - name: Unit tests
        shell: bash
        run: |
          for c in "sve SVE" "sve NEON --fast" "nosve NEON --fast"; do
            set -- $c; ut=$(find /tmp/n13/build_$1 -name vvenc_unit_test -type f | head -1)
            rc=0; $ut --SIMD=$2 ${3:-} > /tmp/ut.log 2>&1 || rc=$?
            echo "$1 build --SIMD=$2 ${3:-} rc=$rc"; grep -iE "passed|fail" /tmp/ut.log | tail -3 || true
          done
      - name: Bench (two rounds)
        shell: bash
        run: |
          for round in 1 2; do
            for v in nosve sve; do echo "== round $round: n13 $v"; /tmp/bench_n13_$v || true; done
          done
      - name: md5 SVE vs NEON (one encode each)
        shell: bash
        run: |
          app=$(find /tmp/n13/build_sve -name vvencFFapp -type f | head -1)
          for s in SVE NEON; do
            { curl -sL https://media.xiph.org/video/derf/y4m/crowd_run_1080p50.y4m || true; } | python3 .github/sve-check/n13b/y4m_head.py 5 \
              | $app -i - --y4m=1 --preset fast --UseNonLinearAlfLuma 1 --UseNonLinearAlfChroma 1 -f 5 -t 4 --SIMD=$s -b /tmp/out_$s.266 > /tmp/enc_$s.log 2>&1 || echo "encode failed: $s"
            echo "$s $(md5sum < /tmp/out_$s.266) $(stat -c %s /tmp/out_$s.266) bytes"; tail -2 /tmp/enc_$s.log
          done
          if [ -s /tmp/out_SVE.266 ] && cmp -s /tmp/out_SVE.266 /tmp/out_NEON.266; then echo "md5 MATCH"; else echo "md5 MISMATCH or empty"; exit 1; fi
