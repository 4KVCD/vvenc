# Temporary check, run only on this fork's sve-check* branches (not part of any pull request): the SVE kernels,
# which the regular CI does not build (GCC 13 lacks arm_neon_sve_bridge.h), tested and timed on an SVE machine.
# Every step reports and none fails the job: the log is read by hand.
name: SVE check

on:
  push:
    branches: [sve-check*]

jobs:
  sve:
    name: "MCTF and RdCost unit tests, column and SSE benches, NEON / SVE / SVE2 (GCC 14, ubuntu-24.04-arm)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: CPU
        run: lscpu | grep -i -E 'model name|flags' || true
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVVENC_TOPLEVEL_OUTPUT_DIRS=OFF \
                -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 | tee cmake.log
          grep -i "sve" cmake.log || true
          cmake --build build --target vvenc vvenc_unit_test || true
          g++-14 -O2 -std=c++14 -Isource/Lib -Iinclude -Ibuild -Ibuild/include \
              .github/sve-check/bench_mctf_column.cpp build/lib/libvvenc.a -lpthread -o bench_column || true
          g++-14 -O2 -std=c++14 -Isource/Lib -Iinclude -Ibuild -Ibuild/include \
              .github/sve-check/bench_sse.cpp build/lib/libvvenc.a -lpthread -o bench_sse || true
          find build -name vvenc_unit_test -type f
      - name: Unit tests (MCTF, RdCost)
        shell: bash
        run: |
          ut=$(find build -name vvenc_unit_test -type f | head -1)
          for t in MCTF RdCost; do
            for simd in SVE2 SVE NEON; do
              echo "== $t $simd"
              $ut --SIMD=$simd --testcase=$t --seed=1 > ut_${t}_$simd.log 2>&1; echo "exit $?"
              grep -i -E "failed" ut_${t}_$simd.log | head -20 || true; tail -1 ut_${t}_$simd.log
            done
          done
      - name: Bench (three rounds, alternating)
        shell: bash
        run: |
          for round in 1 2 3; do
            for simd in NEON SVE; do
              echo "== $simd, round $round"; ./bench_column $simd || true; ./bench_sse $simd || true
            done
          done
